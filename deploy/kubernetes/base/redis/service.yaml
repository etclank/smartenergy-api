apiVersion: v1
kind: Service
metadata:
  name: smartenergy-redis
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: smartenergy-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: smartenergy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: smartenergy-redis
    app.kubernetes.io/component: cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
