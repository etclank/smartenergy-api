apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-metrics-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smartenergy
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: observability
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
          port: 9090
