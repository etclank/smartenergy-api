apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartenergy-beat
  labels:
    app.kubernetes.io/name: smartenergy
    app.kubernetes.io/component: beat
    app.kubernetes.io/part-of: smartenergy
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: smartenergy
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartenergy
        app.kubernetes.io/component: beat
        app.kubernetes.io/part-of: smartenergy
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: beat
          image: ghcr.io/etclank/smartenergy-api@sha256:7a35d14461bd6ee81bf67cf09bef792c866ad7673add9077e7b770e5fff99792
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: smartenergy-config
          env:
            - name: ROLE
              value: beat
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: smartenergy-redis
                  key: REDIS_URL
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: smartenergy-redis
                  key: CELERY_BROKER_URL
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: smartenergy-redis
                  key: CELERY_RESULT_BACKEND
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 50m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
