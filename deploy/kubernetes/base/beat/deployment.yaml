apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartenergy-beat
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: smartenergy
    app.kubernetes.io/component: beat
    app.kubernetes.io/part-of: smartenergy
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: smartenergy
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartenergy
        app.kubernetes.io/component: beat
        app.kubernetes.io/part-of: smartenergy
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: beat
          image: ghcr.io/etclank/smartenergy-api@sha256:0d13398c342931d23d726b4db1903508272e45fefc27687f9cfe311798a4e363
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: smartenergy-config
          env:
            - name: ROLE
              value: beat
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: smartenergy-postgres
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: smartenergy-redis
                  key: REDIS_URL
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: smartenergy-redis
                  key: CELERY_BROKER_URL
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: smartenergy-redis
                  key: CELERY_RESULT_BACKEND
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
