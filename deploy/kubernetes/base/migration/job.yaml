apiVersion: batch/v1
kind: Job
metadata:
  name: smartenergy-migration
  labels:
    app.kubernetes.io/name: smartenergy
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: smartenergy
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
    smartenergy.eoghanclancy.eu/image-source-revision: 5961af5ce36d3aed2fa81ac85da107627e9b2f35
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartenergy
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: smartenergy
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: ghcr.io/etclank/smartenergy-api@sha256:0d13398c342931d23d726b4db1903508272e45fefc27687f9cfe311798a4e363
          imagePullPolicy: IfNotPresent
          command:
            - alembic
            - upgrade
            - head
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: smartenergy-postgres
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 150m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
