apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartenergy-api
spec:
  replicas: 1
  # Initialization uses create_all, not a concurrent/versioned migration system.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: smartenergy-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartenergy-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Replace using an environment overlay before deployment.
          image: smartenergy-api:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: smartenergy-runtime
          env:
            - name: ENV
              value: prod
            - name: ROLE
              value: web
            - name: PORT
              value: "8000"
            - name: SEED_DEMO
              value: "0"
            - name: ENABLE_TELEMETRY
              value: "0"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          # HTTP process/cache status only; not a database readiness guarantee.
          readinessProbe:
            httpGet:
              path: /api/health/z
              port: http
            timeoutSeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: logs
          emptyDir:
            sizeLimit: 64Mi
