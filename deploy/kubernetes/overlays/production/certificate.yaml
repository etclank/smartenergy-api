apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: smartenergy
  labels:
    app.kubernetes.io/name: smartenergy
    app.kubernetes.io/part-of: smartenergy
spec:
  secretName: smartenergy-tls
  dnsNames:
    - energy.platform.eoghanclancy.eu
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-production
