# render.yaml
services:
  - type: web
    name: smartenergy-api
    env: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health/z
    autoDeploy: true
    dockerfilePath: ./docker/Dockerfile
    envVars:
      - key: ENV
        value: prod

      # --- Choose ONE of these database configs ---

      # A) Easy first deploy (stateless; data resets on redeploy):
      # value: "sqlite+aiosqlite:////tmp/app.db"

      # B) Proper database (Render Postgres or Neon):
      # e.g. postgresql+asyncpg://USER:PASSWORD@HOST:5432/DBNAME
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:////tmp/app.db"

      # Optional Redis (Upstash or Render Redis)
      - key: REDIS_URL
        value: ""

      # Auth
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALG
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"

      # CORS (comma-separated if multiple)
      - key: FRONTEND_ORIGINS
        value: ""
