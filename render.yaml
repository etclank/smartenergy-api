# -------------------------------------
# SmartEnergy API — Render Deployment
# -------------------------------------
services:
  - type: web
    name: smartenergy-api
    env: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health/z
    autoDeploy: true
    dockerfilePath: ./docker/Dockerfile

    envVars:
      # Environment mode
      - key: ENV
        value: prod

      # --- Database configuration ---
      # Option A — Ephemeral SQLite (free tier)
      # - key: DATABASE_URL
      #   value: "sqlite+aiosqlite:////tmp/app.db"

      # Option B — Persistent Postgres (uncomment and replace credentials)
      - key: DATABASE_URL
        value: "postgresql+asyncpg://smartenergy_db_user:REMOVED_SECRET@dpg-d3kechpr0fns73er9p60-a/smartenergy_db"

      # --- Redis (optional) ---
      - key: REDIS_URL
        value: ""

      # --- Auth ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALG
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"

      # --- App configuration ---
      - key: FRONTEND_ORIGINS
        value: ""
      - key: SEED_DEMO
        value: "1"

      # --- Optional logging toggle ---
      - key: LOG_LEVEL
        value: "info"
