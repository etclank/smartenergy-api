# -------------------------------------
# SmartEnergy API — Render Deployment
# -------------------------------------
services:
  - type: web
    name: smartenergy-api
    env: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health/z
    autoDeploy: true
    dockerfilePath: ./docker/Dockerfile

    envVars:
      # --- Environment ---
      - key: ENV
        value: prod

      # --- Database (Persistent Postgres) ---
      - key: DATABASE_URL
        value: "postgresql+asyncpg://smartenergy_db_user:REMOVED_SECRET@dpg-d3kechpr0fns73er9p60-a/smartenergy_db"

      # --- Redis (Upstash example) ---
      - key: REDIS_URL
        value: "rediss://:REMOVED_SECRET@oriented-ewe-24218.upstash.io:6379"
      - key: CACHE_TTL_SECONDS
        value: "60"

      # --- JWT ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALG
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"

      # --- Demo data ---
      - key: SEED_DEMO
        value: "1"

      # --- SendGrid (optional for health email) ---
      - key: SENDGRID_API_KEY
        sync: false
      - key: HEALTH_EMAIL_TO
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false

      # --- Logging ---
      - key: LOG_LEVEL
        value: "info"

  # 🧠 Celery Worker + Beat
  - type: worker
    name: smartenergy-worker
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/Dockerfile
    startCommand: celery -A app.tasks.worker.celery_app worker --beat --loglevel=info
    envVars:
      - key: ENV
        value: prod

      - key: DATABASE_URL
        value: "postgresql+asyncpg://smartenergy_db_user:REMOVED_SECRET@dpg-d3kechpr0fns73er9p60-a/smartenergy_db"
      - key: REDIS_URL
        value: "rediss://:REMOVED_SECRET@oriented-ewe-24218.upstash.io:6379"

      # Sync secrets from the web service
      - key: JWT_SECRET
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: HEALTH_EMAIL_TO
        sync: false
