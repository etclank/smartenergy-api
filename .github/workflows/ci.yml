name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      JWT_SECRET: test-secret
      ENABLE_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pip install poetry==2.2.1
      - name: Install locked dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Lint
        run: poetry run ruff check .
      - name: Format
        run: poetry run ruff format --check .
      - name: Type check
        run: poetry run mypy --config-file mypy.ini app
      - name: Tests and coverage
        run: poetry run pytest --cov=app --cov-branch --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dashboard smoke
        run: node tests/dashboard_smoke.cjs
      - name: Build image
        run: docker build -f docker/Dockerfile -t smartenergy-api:ci .
