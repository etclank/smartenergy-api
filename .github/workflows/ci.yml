name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      JWT_SECRET: test-secret
      ENABLE_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pip install poetry==2.2.1
      - name: Install locked dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Lint
        run: poetry run ruff check .
      - name: Format
        run: poetry run ruff format --check .
      - name: Type check
        run: poetry run mypy --config-file mypy.ini app
      - name: Tests and coverage
        run: poetry run pytest --cov=app --cov-branch --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Dashboard smoke
        run: node tests/dashboard_smoke.cjs
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartenergy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartenergy_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/smartenergy_test
      TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/smartenergy_test
      JWT_SECRET: postgres-integration-test-secret
      REDIS_URL: ""
      ENABLE_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pip install poetry==2.2.1
      - name: Install locked dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Upgrade empty PostgreSQL schema
        run: poetry run alembic upgrade head
      - name: Verify migration revision and model drift
        run: |
          poetry run alembic current
          poetry run alembic heads
          poetry run alembic check
      - name: PostgreSQL integration tests
        run: >-
          poetry run pytest --confcutdir=tests/integration
          tests/integration -m postgres

  celery-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: sqlite+aiosqlite:////tmp/smartenergy-celery.db
      JWT_SECRET: celery-integration-test-secret
      REDIS_URL: redis://127.0.0.1:6379/13
      CELERY_BROKER_URL: redis://127.0.0.1:6379/14
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/15
      TEST_CELERY_BROKER_URL: redis://127.0.0.1:6379/14
      TEST_CELERY_RESULT_URL: redis://127.0.0.1:6379/15
      ENABLE_TELEMETRY: "0"
      ENV: prod
      ROLE: worker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pip install poetry==2.2.1
      - name: Install locked dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Run broker, worker, and result-backend integration
        run: |
          poetry run celery -A app.tasks.worker.celery_app worker --pool=solo --concurrency=1 --loglevel=warning --pidfile=/tmp/smartenergy-celery.pid &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; wait "$worker_pid" 2>/dev/null || true' EXIT
          poetry run pytest --confcutdir=tests/integration tests/integration/test_celery_runtime.py -m celery

  image-runtime:
    runs-on: ubuntu-latest
    needs: [ci, postgres-integration, celery-integration]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build runtime image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: smartenergy-api:ci
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Inspect image contract
        run: |
          test "$(docker image inspect smartenergy-api:ci --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect smartenergy-api:ci --format '{{.Architecture}}')" = "amd64"
          test "$(docker image inspect smartenergy-api:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker run --rm --entrypoint /bin/sh smartenergy-api:ci -c \
            '! command -v gcc && ! command -v make && ! command -v poetry && command -v alembic && command -v uvicorn && command -v celery'
      - name: Smoke read-only runtime
        run: |
          runtime_args=(--rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001 \
            -e JWT_SECRET=ci-runtime-secret-with-at-least-32-characters \
            -e DATABASE_URL=sqlite+aiosqlite:////tmp/runtime.db \
            -e ENABLE_TELEMETRY=0)
          docker run "${runtime_args[@]}" smartenergy-api:ci \
            python -c 'import app.main; print("application import ok")'
          docker run "${runtime_args[@]}" smartenergy-api:ci alembic heads
          if docker run "${runtime_args[@]}" -e ROLE=unsupported smartenergy-api:ci \
            > /tmp/unsupported-role.log 2>&1; then
            echo "unsupported ROLE unexpectedly succeeded" >&2
            exit 1
          else
            unsupported_status=$?
          fi
          cat /tmp/unsupported-role.log
          test "$unsupported_status" -eq 64
          grep -F "Unsupported ROLE: unsupported" /tmp/unsupported-role.log

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: image-runtime
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate immutable tag
        run: |
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "ghcr.io/etclank/smartenergy-api:$GITHUB_SHA" = \
            "ghcr.io/etclank/smartenergy-api:${{ github.sha }}"
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/etclank/smartenergy-api:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '{\n  "image": "%s",\n  "tag": "%s",\n  "digest": "%s",\n  "revision": "%s"\n}\n' \
            'ghcr.io/etclank/smartenergy-api' "$GITHUB_SHA" "$IMAGE_DIGEST" "$GITHUB_SHA" \
            > image-metadata.json
          {
            echo '### Published SmartEnergy image'
            echo
            echo "- Tag: \`ghcr.io/etclank/smartenergy-api:$GITHUB_SHA\`"
            echo "- Digest: \`$IMAGE_DIGEST\`"
            echo "- Deployment reference: \`ghcr.io/etclank/smartenergy-api@$IMAGE_DIGEST\`"
            echo '- SBOM and provenance: attached to the image as OCI attestations'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload image metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-metadata-${{ github.sha }}
          path: image-metadata.json
          if-no-files-found: error
