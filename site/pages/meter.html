<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SmartEnergy – Meter Detail</title>
  <base href="/site/">
  <link rel="stylesheet" href="/site/assets/css/style.css" />
  <script src="/site/assets/config.js"></script>
  <script src="/site/assets/js/api.js" defer></script>
  <script src="/site/assets/vendor/chart.min.js"></script>
  <script src="/site/assets/vendor/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="/site/assets/js/charts.js"></script>
  <script src="/site/assets/js/components/breadcrumb.js"></script>
  <script src="/site/assets/js/pages/meter.js" defer></script>

<body>
  <div class="topbar">
    <button id="theme-toggle" class="theme-btn">🌙</button>
    <h1><a href="/site/">SmartEnergy</a></h1>
    <ul class="nav">
      <li><a href="/site/pages/sites.html">Sites</a></li>
      <li><a href="/site/pages/meters.html">Meters</a></li>
      <li><a href="/site/pages/tariffs.html">Tariffs</a></li>
    </ul>

  <div class="container">
    <nav id="breadcrumb"></nav>

    <h2>Meter Details</h2>
    <div id="meter-detail"><p>Loading meter info…</p></div>

    <!-- 🔹 Date Range Controls -->
    <div class="date-range-controls card">
      <label>
        Start:
        <input type="date" id="startDate" />
      </label>
      <label>
        End:
        <input type="date" id="endDate" />
      </label>
      <button id="applyRange">Apply</button>
      <button id="resetRange" class="secondary-btn">Reset</button>
    </div>

    <section id="energy-charts">
      <p>Loading charts…</p>
    </section>
  </div>
