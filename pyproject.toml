[tool.poetry]
name = "smartenergy-api"
version = "0.1.0"
description = "Backend for ingesting and serving smart-meter energy readings"
authors = ["Eoghan Clancy eoghanclancy@live.com"]
license = "MIT"
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
sqlalchemy = ">=2.0"
pydantic-settings = "^2.4.0"
python-jose = "^3.3.0"
passlib = {version = "1.7.4", extras = ["bcrypt"]}
redis = "^5.0.8"                 # asyncio supported
httpx = "^0.27.0"                # used in tests too
psycopg = {extras = ["async", "binary"], version = "^3.2.10"}
aiosqlite = "^0.20"
python-multipart = "^0.0.20"
aiofiles = "^23.2.1"
asyncpg = "^0.30.0"
bcrypt = "4.0.1"
celery = "^5.5.3"
opentelemetry-api = "^1.38.0"
opentelemetry-sdk = "^1.38.0"
opentelemetry-exporter-otlp-proto-http = "^1.38.0"
opentelemetry-instrumentation = "^0.59b0"
opentelemetry-instrumentation-fastapi = "^0.59b0"
opentelemetry-instrumentation-sqlalchemy = "^0.59b0"
opentelemetry-instrumentation-httpx = "^0.59b0"
opentelemetry-instrumentation-redis = "^0.59b0"
loguru = "^0.7.3"
prometheus-client = "^0.23.1"
psutil = "^7.1.1"
alembic = "^1.16.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^1.0.0"
pytest-cov = "^5.0.0"
ruff = "^0.4.0"
mypy = "^1.10.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
